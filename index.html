:root {
  box-sizing: border-box;
  --fs: 15px;
  --sat: env(safe-area-inset-top,0px);
  --h: 262;
  --bg: oklch(.965 .014 var(--h));
  --panel: oklch(.995 .004 var(--h));
  --ink: oklch(.22 .03 var(--h));
  --muted: oklch(.5 .04 var(--h));
  --line: oklch(.88 .02 var(--h));
  --accent: oklch(.55 .2 var(--h));
  --on-accent: #fff;
  --field: oklch(.975 .01 var(--h));
  --dg: oklch(.58 .21 25);
  color-scheme: light;
}
:root[data-accent=blue] {
  --h: 262;
}
:root[data-accent=violet] {
  --h: 295;
}
:root[data-accent=teal] {
  --h: 190;
}
:root[data-accent=green] {
  --h: 150;
}
:root[data-accent=orange] {
  --h: 55;
}
:root[data-accent=pink] {
  --h: 355;
}
:root[data-accent=red] {
  --h: 25;
}
:root[data-accent=amber] {
  --h: 85;
}
:root[data-accent=lime] {
  --h: 125;
}
:root[data-accent=cyan] {
  --h: 215;
}
:root[data-accent=sky] {
  --h: 240;
}
:root[data-accent=indigo] {
  --h: 278;
}
:root[data-accent=fuchsia] {
  --h: 325;
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme=light]) {
    --bg: oklch(.17 .035 var(--h));
    --panel: oklch(.22 .04 var(--h));
    --ink: oklch(.95 .01 var(--h));
    --muted: oklch(.72 .04 var(--h));
    --line: oklch(.32 .05 var(--h));
    --accent: oklch(.72 .16 var(--h));
    --on-accent: oklch(.18 .04 var(--h));
    --field: oklch(.19 .035 var(--h));
    color-scheme: dark;
  }
}
:root[data-theme=dark],:root[data-theme=black] {
  --bg: oklch(.17 .035 var(--h));
  --panel: oklch(.22 .04 var(--h));
  --ink: oklch(.95 .01 var(--h));
  --muted: oklch(.72 .04 var(--h));
  --line: oklch(.32 .05 var(--h));
  --accent: oklch(.72 .16 var(--h));
  --on-accent: oklch(.18 .04 var(--h));
  --field: oklch(.19 .035 var(--h));
  color-scheme: dark;
}
:root[data-accent=mono] {
  --bg: oklch(.965 0 0);
  --panel: oklch(1 0 0);
  --ink: oklch(.2 0 0);
  --muted: oklch(.5 0 0);
  --line: oklch(.87 0 0);
  --accent: oklch(.25 0 0);
  --on-accent: #fff;
  --field: oklch(.975 0 0);
}
@media (prefers-color-scheme:dark) {
  :root[data-accent=mono]:not([data-theme=light]) {
    --bg: oklch(.16 0 0);
    --panel: oklch(.21 0 0);
    --ink: oklch(.95 0 0);
    --muted: oklch(.72 0 0);
    --line: oklch(.32 0 0);
    --accent: oklch(.92 0 0);
    --on-accent: oklch(.15 0 0);
    --field: oklch(.18 0 0);
  }
}
:root[data-accent=mono][data-theme=dark],:root[data-accent=mono][data-theme=black] {
  --bg: oklch(.16 0 0);
  --panel: oklch(.21 0 0);
  --ink: oklch(.95 0 0);
  --muted: oklch(.72 0 0);
  --line: oklch(.32 0 0);
  --accent: oklch(.92 0 0);
  --on-accent: oklch(.15 0 0);
  --field: oklch(.18 0 0);
}
/* Black (OLED) theme: dark palette on a pure black page. */
:root[data-theme=black],:root[data-theme=black][data-accent=mono] {
  --bg: #000;
  --panel: oklch(.13 .012 var(--h));
  --line: oklch(.26 .03 var(--h));
  --field: oklch(.1 .01 var(--h));
}
*,*::before,*::after {
  box-sizing: inherit;
  -webkit-tap-highlight-color: transparent;
}
[hidden] {
  display: none!important;
}
@media(hover:hover) and (pointer:fine) {
  * {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb,var(--muted) 45%,transparent) transparent;
  }
  @supports not (scrollbar-width:thin) {
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb,var(--muted) 45%,transparent);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
  }
}
html,body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
}
html {
  background: var(--bg);
}
body {
  font: 500 var(--fs)/1.45 "Space Grotesk",Vazirmatn,"Helvetica Neue",Arial,sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  cursor: default;
}
input,[contenteditable=true],#pvw {
  -webkit-user-select: text;
  user-select: text;
}
.glass {
  background: var(--panel);
  border: 1px solid var(--line);
}
button,select,input {
  font: inherit;
  color: var(--ink);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 700;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--field);
  padding: 9px 13px;
  cursor: pointer;
  transition: transform .08s,background .12s;
}
.btn:hover {
  border-color: var(--accent);
}
.btn:active {
  transform: scale(.97);
}
.btn.pri,.btn.on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}
input,select {
  font-weight: 500;
  padding: 9px 11px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--field);
  min-width: 0;
}
button:focus-visible,input:focus-visible,select:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
input[type=checkbox] {
  width: 19px;
  height: 19px;
  padding: 0;
  margin: 0;
  accent-color: var(--accent);
}
#app {
  display: grid;
  grid-template-columns: 230px 1fr;
  gap: 12px;
  height: 100dvh;
  padding: 12px;
}
#side {
  border-radius: 14px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.brand {
  font-size: 1.5em;
  font-weight: 700;
  padding: 4px 10px 8px;
}
.sp {
  flex: 1;
}
#main {
  border-radius: 14px;
  overflow: hidden;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
}
button.it {
  border: 0;
  background: none;
  width: 100%;
  text-align: start;
}
.it {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 9px;
  cursor: pointer;
}
.it:hover {
  background: var(--field);
}
.it:active {
  transform: scale(.98);
}
.it.on {
  background: var(--accent);
  color: var(--on-accent);
}
small {
  color: var(--muted);
}
.it.on small {
  color: inherit;
}
#tabs {
  display: none;
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 2px 4px max(4px,calc(env(safe-area-inset-bottom,0px) - 18px));
  z-index: 5;
  justify-content: space-around;
  border-width: 1px 0 0;
  border-radius: 0;
}
#tabs button {
  flex: 1;
  background: none;
  border: 0;
  border-top: 3px solid transparent;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  padding: 6px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  cursor: pointer;
}
#tabs button.on {
  color: var(--accent);
  border-top-color: var(--accent);
}
.ic {
  font-size: 20px;
  line-height: 1.2;
}
.h {
  font-size: clamp(26px,4vw,34px);
  font-weight: 700;
  line-height: 1.1;
  padding: 16px 16px 2px;
}
.bar {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 14px;
  flex-wrap: wrap;
}
.bar input {
  flex: 1;
  min-width: 110px;
}
.mid {
  flex: 1;
  text-align: center;
  font-weight: 700;
}
.scroll {
  overflow: auto;
  padding: 6px 12px 96px;
  flex: 1;
  min-height: 0;
}
.sec {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  padding: 14px 4px 6px;
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 40px 20px;
}
.gr1 {
  flex: 1;
  min-width: 0;
}
.tr {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#pg {
  display: flex;
  flex: 1;
  min-height: 0;
}
.pl {
  width: var(--npw,310px);
  flex: none;
  display: flex;
  flex-direction: column;
  border-inline-end: 1px solid var(--line);
  min-width: 0;
  min-height: 0;
}
.pr {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.mob {
  display: none;
}
#ed {
  flex: 1 0 auto;
  padding: 6px 20px 96px;
  outline: none;
  font-size: 1.05em;
  line-height: 1.75;
}
#ed.t1 {
  padding-top: 18px;
}
#ed>div {
  min-height: 1.75em;
  white-space: pre-wrap;
  word-break: break-word;
}
#ed.t1>div:first-child {
  font-size: 1.9em;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: .4em;
}
#ed.t1[data-e]>div:first-child::before {
  content: "Untitled";
  color: var(--muted);
}
#ed .mk,#ed .cm {
  display: none;
  color: var(--muted);
  font-weight: 500;
  text-decoration: none;
}
#ed .act .mk,#ed .act .cm {
  display: inline;
}
#ed .sub {
  font-size: .75em;
  line-height: 1.5;
  color: var(--muted);
}
#ed .h1 {
  font-size: 1.8em;
  font-weight: 700;
  line-height: 1.3;
}
#ed .h2 {
  font-size: 1.5em;
  font-weight: 700;
  line-height: 1.3;
}
#ed .h3 {
  font-size: 1.3em;
  font-weight: 700;
}
#ed .h4 {
  font-size: 1.15em;
  font-weight: 700;
}
#ed .h5,#ed .h6 {
  font-weight: 700;
  color: var(--muted);
}
#ed code,#ed .mth {
  font-family: ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size: .9em;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 0 5px;
}
#ed mark {
  background: color-mix(in srgb,gold 45%,transparent);
  color: inherit;
  border-radius: 3px;
}
#ed a {

/* Login, create-account and lock screens (look after the 3x-ui login page). */
.login-app {
  --la-head: color-mix(in srgb,var(--accent) 9%,#fff);
  --la-under: color-mix(in srgb,var(--accent) 20%,#fff);
  --la-card: rgba(255,255,255,.88);

  --la-bd: rgba(255,255,255,.7);

  position: fixed;
  inset: 0;
  z-index: 50;
  overflow: auto;
  background: var(--la-under);
}
.is-dark .login-app {
  --la-head: color-mix(in srgb,var(--accent) 10%,#0d1117);
  --la-under: color-mix(in srgb,var(--accent) 22%,#0d1117);
  --la-card: rgba(28,30,36,.88);
  --la-solid: #1c1e22;
  --la-bd: rgba(255,255,255,.1);
  --la-sh: 0 1px 3px rgba(0,0,0,.4),0 20px 60px color-mix(in srgb,var(--accent) 24%,transparent);
}
.is-black .login-app {
  --la-head: color-mix(in srgb,var(--accent) 7%,#000);
  --la-under: color-mix(in srgb,var(--accent) 15%,#000);
  --la-card: rgba(12,12,16,.88);
  --la-bd: rgba(255,255,255,.06);
}
#lock {
  z-index: 60;
}
.la-waves {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  pointer-events: none;
}
.la-wh {
  height: 50vh;
  background: var(--la-head);
}
.la-sv {
  display: block;
  position: relative;
  width: 100%;
  height: 15vh;
  min-height: 100px;
  max-height: 150px;
  margin-bottom: -8px;
}
.la-par>use {
  animation: la-wave 25s cubic-bezier(.55,.5,.45,.5) infinite;
  fill: color-mix(in srgb,var(--accent) 35%,var(--la-under));
}
.la-par>use:nth-child(1) {
  animation-delay: -2s;
  animation-duration: 7s;
  opacity: .25;
}
.la-par>use:nth-child(2) {
  animation-delay: -3s;
  animation-duration: 10s;
  opacity: .4;
}
.la-par>use:nth-child(3) {
  animation-delay: -4s;
  animation-duration: 13s;
  opacity: .6;
}
.la-par>use:nth-child(4) {
  animation-delay: -5s;
  animation-duration: 16s;
  fill: var(--la-under);
}
@keyframes la-wave {
  from {
    transform: translate3d(-90px,0,0);
  }
  to {
    transform: translate3d(85px,0,0);
  }
}

// Upload a folder from this device as a new vault (only .md files are kept).
async function upFolder(inp) {
  const all = [...inp.files], fs = all.filter(f => /\.md$/i.test(f.name) && !(f.webkitRelativePath || f.name).split('/').some(x => x.startsWith('.')));
  inp.value = '';
  if (!fs.length) return toast('No .md notes found in that folder.');
  const root = (fs[0].webkitRelativePath || '').split('/')[0] || 'Vault';
  let n = root.replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 28) || 'Vault';
  for (let k = 2; ME.vaults.includes(n); k++) n = n.slice(0, 28)+'-'+k;
  try {
    await api('/api/vault', {method: 'POST', json: {name: n}});
    let d = 0, i = 0;
    const run = async() => {
      while (i < fs.length) {
        const f = fs[i++], rel = (f.webkitRelativePath || f.name).split('/').slice(1).join('/') || f.name;
        await api(`/api/v/${n}/f?p=${encodeURIComponent('notes/'+rel)}`, {method: 'PUT', body: await f.text()});
        if (++d % 10 == 0) toast(`Uploading ${d} / ${fs.length}…`)
      }
    };
    await Promise.all([run(), run(), run(), run()]);
    ME = await api('/api/me');
    V = n;
    localStorage.v = n;
    toast(`Uploaded ${fs.length} notes to “${n}”`);
    vaultsChanged()
  } catch (e) {
    toast(e.message || 'Upload failed.')
  }
}

/* ---------- Dropdowns (from UI_elements.html) ---------- */
let ddOpen = null;
const DDS = new Set();
// Custom dropdown (from UI_elements.html) replacing a native <select>.
function makeDD(sel) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'ddbtn';
  btn.setAttribute('aria-haspopup', 'listbox');
  btn.setAttribute('aria-expanded', 'false');
  btn.innerHTML = '<span class=ddlbl></span>'+ic('down', 16);
  const list = document.createElement('ul');
  list.className = 'ddlist';
  list.setAttribute('role', 'listbox');
  list.hidden = true;
  document.body.appendChild(list);
  sel.parentNode.insertBefore(btn, sel);
  sel.style.display = 'none';
  const dd = {act: 0, sel, list};
  dd.sync = () => {
    const o = sel.options[sel.selectedIndex], t = o ? o.textContent : '', c = o && o.dataset.c || '', k = c+'|'+t;
    if (btn.firstChild._k !== k) {
      btn.firstChild._k = k;
      btn.firstChild.innerHTML = (c ? `<i class=sw style="background:${c}"></i>` : '')+esc(t)
    }
  };
  dd.build = () => {
    list.innerHTML = '';
    [...sel.options].forEach((o, i) => {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.innerHTML = (o.dataset.c ? `<i class=sw style="background:${o.dataset.c}"></i>` : '')+esc(o.textContent);
      li.setAttribute('aria-selected', i === sel.selectedIndex);
      li.onclick = e => {
        e.stopPropagation();
        dd.pick(i)
      };
      li.onpointermove = () => {
        if (dd.act !== i) dd.hl(i)
      };
      list.appendChild(li)
    })
  };
  dd.hl = i => {
    dd.act = i;
    [...list.children].forEach((li, j) => li.classList.toggle('act', j == i));
    list.children[i]?.scrollIntoView({block: 'nearest'})
  };
  dd.pick = i => {
    const ch = sel.selectedIndex !== i;
    sel.selectedIndex = i;
    dd.close();
    dd.sync();
    btn.focus();
    if (ch) sel.dispatchEvent(new Event('change', {bubbles: true}))
  };
  dd.open = () => {
    ddOpen && ddOpen !== dd && ddOpen.close();
    dd.build();
    list.hidden = false;
    list.style.visibility = 'hidden';
    btn.setAttribute('aria-expanded', 'true');
    const r = btn.getBoundingClientRect();
    list.style.minWidth = r.width+'px';
    const w = list.offsetWidth, h = list.offsetHeight;
    let top = r.bottom+6;
    if (top+h > innerHeight-8 && r.top-6-h > 8) top = r.top-6-h;
    list.style.left = Math.max(8, Math.min(r.left, innerWidth-8-w))+'px';
    list.style.top = top+'px';
    list.style.visibility = '';
    ddOpen = dd;
    dd.hl(Math.max(0, sel.selectedIndex))
  };
  dd.close = () => {
    list.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    if (ddOpen === dd) ddOpen = null
  };
  btn.onclick = e => {
    e.stopPropagation();
    list.hidden ? dd.open() : dd.close()
  };
  btn.onkeydown = e => {
    const k = e.key, c = sel.options.length;
    if (list.hidden) {
      if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(k)) {
        e.preventDefault();
        dd.open()
      }
      return
    }
    if (k == 'ArrowDown') {
      e.preventDefault();
      dd.hl(Math.min(c-1, dd.act+1))
    } else if (k == 'ArrowUp') {
      e.preventDefault();
      dd.hl(Math.max(0, dd.act-1))
    } else if (k == 'Enter' || k == ' ') {
      e.preventDefault();
      dd.pick(dd.act)
    } else if (k == 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      dd.close()
    } else if (k == 'Tab') dd.close()
  };
  dd.sync();
  sel._dd = dd;
  DDS.add(dd)
}
// Upgrade new selects and sync existing ones.
function enh() {
  document.querySelectorAll('select').forEach(s => s._dd ? s._dd.sync() : makeDD(s));
  for (const d of DDS) if (!d.sel.isConnected) {
    d.list.remove();
    DDS.delete(d)
  }
}
