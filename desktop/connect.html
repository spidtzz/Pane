<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Connect to Pane</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#141a2b;--mut:#6b748a;--line:#dde2ee;--acc:#ff5436}
@media (prefers-color-scheme:dark){:root{--bg:#0d1526;--card:#141e33;--ink:#eef1f8;--mut:#93a0ba;--line:#243150}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-app-region:drag}
main{width:min(420px,92vw);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;-webkit-app-region:no-drag}
.logo{width:56px;height:56px;border-radius:14px;background:var(--acc);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:11px;margin-bottom:18px}
.logo i{background:#fff;border-radius:3px}.logo i:first-child{grid-row:1/3}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 20px;color:var(--mut)}
input{width:100%;font:inherit;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#d6322e;margin:10px 0 0;min-height:1.4em;font-size:14px}
small{display:block;color:var(--mut);margin-top:14px}
</style></head><body><main>
<div class="logo"><i></i><i></i><i></i></div>
<h1>Connect to your Pane</h1>
<p>Enter the address of the Pane server you host.</p>
<form id="f"><input id="u" placeholder="notes.example.com or 192.168.1.10:3000" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
<button id="b">Connect</button><div class="err" id="e" role="alert"></div></form>
<small>Your notes stay on your server. This app only opens it in a window.</small>
</main>
<script>
const $=id=>document.getElementById(id), q=new URLSearchParams(location.search);
paneDesktop.current().then(v=>{ $('u').value=q.get('url')||v||'' });
if(q.get('err')==='offline') $('e').textContent='Could not reach the server. Check your connection or change the address.';
$('f').onsubmit=async e=>{e.preventDefault();$('b').disabled=true;$('b').textContent='Connecting…';$('e').textContent='';
 const r=await paneDesktop.connect($('u').value);
 if(r){$('e').textContent=r;$('b').disabled=false;$('b').textContent='Connect'}};
</script></body></html>
